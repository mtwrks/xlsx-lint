name: xlsx-lint
description: Find Excel formulas that break their own pattern. Runs locally in your workflow — no upload, no service, no API key.
branding:
  icon: grid
  color: blue
inputs:
  path:
    description: File, glob or directory to inspect.
    required: false
    default: "."
  severity:
    description: Minimum severity that fails the run — high, med or low.
    required: false
    default: high
  recursive:
    description: Recurse into directories.
    required: false
    default: "true"
  json:
    description: Emit machine-readable JSON instead of text.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Run xlsx-lint
      shell: bash
      run: |
        ARGS=("${{ inputs.path }}" --severity "${{ inputs.severity }}")
        [ "${{ inputs.recursive }}" = "true" ] && ARGS+=(--recursive)
        [ "${{ inputs.json }}" = "true" ] && ARGS+=(--json)
        node "${{ github.action_path }}/src/cli.mjs" "${ARGS[@]}"
